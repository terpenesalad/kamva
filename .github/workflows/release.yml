name: Build and release

# Runs when a version tag is pushed, or when the `release` branch is updated
# (the release is then tagged v<version> from package.json).
on:
  push:
    tags: ['v*']
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            ffmpeg: win32 x64
            optional: false
          - os: macos-latest
            target: --mac
            ffmpeg: darwin arm64
            optional: true
          - os: ubuntu-latest
            target: --linux
            ffmpeg: linux x64
            optional: true
    runs-on: ${{ matrix.os }}
    # Windows is the primary target; macOS/Linux builds never block a release
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-ffmpeg.mjs ${{ matrix.ffmpeg }}
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: kamva-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*-mac.zip
            release/*.AppImage
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Kamva ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          body_path: .github/RELEASE_NOTES.md
          files: artifacts/*
          draft: false
